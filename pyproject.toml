[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "computational-machine-design"
version = "0.2.0"
description = "AI-driven mechanical design CLI: CAD, structural analysis and drawing generation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "rich>=13.7.0,<16",
    "jinja2>=3.1.0,<4",
    "numpy>=1.26.0,<3",
    "scipy>=1.12.0,<2",
    "pydantic>=2.7.0,<3",
]

[project.optional-dependencies]
draw = ["matplotlib>=3.8.0,<4"]
convert = ["python-docx>=1.1.0", "Markdown>=3.5", "PyMuPDF>=1.24.0", "Pillow>=10.0.0"]
ai = ["google-genai>=1.0.0"]
# python-docx backs the DOCX converter tests; matplotlib backs the drawing
# regression tests. Both are needed for a full `python -m pytest` run.
dev = ["pytest>=8.0.0,<10", "python-docx>=1.1.0", "matplotlib>=3.8.0,<4"]

[project.scripts]
computational-machine-design = "cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "ai*", "cad*", "cli*", "components*", "convert*", "core*", "drafting*",
    "integrations*", "materials*", "optimizer*", "physics*", "reporting*",
]
exclude = ["tests*", "scratch*", "Project*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "__pycache__", "Project", ".pytest_cache", "*.egg-info", "computational_machine_design.egg-info"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "T20", # flake8-print
]
ignore = [
    "S101", # assert used (allowed in tests)
    "T201", # print used (allowed in CLI)
    "B008", # function calls in default arg (allowed for performance)
]
per-file-ignores = { "tests/*" = ["S101", "T201"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
files = ["ai", "cad", "cli", "components", "convert", "core", "drafting", "integrations", "materials", "optimizer", "physics", "reporting"]
exclude = ["tests", "scratch", "Project", ".venv", "__pycache__", "\\.egg-info$"]