[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdie"
version = "0.2.0"
description = "Mechanical Design Intelligence Engine - AI-driven CAD, structural analysis and drawing generation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "rich>=13.7.0",
    "jinja2>=3.1.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pydantic>=2.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]

[project.optional-dependencies]
draw = ["matplotlib>=3.8.0"]
convert = ["python-docx>=1.1.0", "Markdown>=3.5", "PyMuPDF>=1.24.0", "Pillow>=10.0.0"]
ai = ["google-genai>=1.0.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
mdie = "mdie.cli:main"

[tool.setuptools.packages.find]
include = ["mdie*"]

[tool.setuptools.package-data]
"mdie.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]