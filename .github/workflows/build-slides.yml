name: Build & Publish Armchair Slides

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-slides:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install reveal.js
        run: npm install revealjs/revealjs

      - name: Install marp-cli and plugin
        run: npm install -g marp-cli marp-revealjs

      - name: Build Reveal.js slides
        run: marp --revealjs "Project/chair/armchair_slides.md" --output ".reveal.js/armchair_slides.html" --theme "white" --transition "fade"

      - name: Deploy to GitHub Pages (optional)
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git worktree add -B gh-pages origin/gh-pages 2>/dev/null || git worktree add gh-pages origin/gh-pages 2>/dev/null || (git checkout --orphan gh-pages && git rm -r . && git worktree add gh-pages)
          copy .\reveal.js\armchair_slides.html gh-pages\
          cd gh-pages
          git add -A
          git commit -m "Update armchair slides [ci skip]" || echo "No changes to commit"
          git push origin gh-pages